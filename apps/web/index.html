<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` so the board can paint under a notch and a home indicator;
         the panels that float over it pad themselves back out with `env(safe-area-inset-*)`.
         `interactive-widget` keeps the on-screen keyboard resizing the layout rather than
         sliding a fixed-position board out from under itself. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Think Beyond the horizon..." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link
      rel="preload"
      href="/fonts/comic-neue-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Meadow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
