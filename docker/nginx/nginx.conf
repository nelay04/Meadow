# Base nginx config. The site itself is in conf.d/meadow.conf.
#
# This replaces the stock nginx.conf for one reason: the `map` below has to live at
# http level and the stock file does not have it.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Long-lived websockets should not be counted against the proxy's idea of a slow
    # client. A board with nobody typing sends nothing for minutes at a time.
    proxy_buffering off;

    # A websocket handshake sends `Connection: Upgrade`; an ordinary request must not.
    # Hardcoding `Connection: upgrade` on the proxy pass would break keepalive for
    # every REST call sharing the same location block.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # The default is 1, which on these pages leaves several KB on the table: they are
    # hand-written HTML with their CSS inline, so the document is the whole payload.
    # 5 is the usual knee of the curve, well short of the CPU 9 costs per request.
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;
    # No gzip on woff2. It is already compressed, and re-compressing costs CPU per
    # request to make the file very slightly larger.

    include /etc/nginx/conf.d/*.conf;
}
